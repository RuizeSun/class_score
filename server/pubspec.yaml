name: class_score_server
description: class_score 同步服务端（shelf + sqlite3，单文件 exe 部署）
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.9.0

dependencies:
  args: ^2.5.0
  crypto: ^3.0.0
  shelf: ^1.4.0
  shelf_router: ^1.1.0
  sqlite3: ^2.4.0
  class_score_sync_protocol:
    path: ../packages/sync_protocol

executables:
  class_score_server: main
