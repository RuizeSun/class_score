name: Flutter Windows CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    # 手动补跑 Gitee 镜像：1.6.2 的镜像因 refspec bug 失败，用它把已发版的
    # 产物补到 Gitee，不必再发一个新版本。
    workflow_dispatch:
        inputs:
            mirror_version:
                description: '只补跑 Gitee 镜像（填已发版版本号，如 1.6.2）；留空则正常发版'
                required: false
                default: ''

jobs:
    build-windows:
        runs-on: windows-latest
        # 手动补跑镜像时不需要重新构建：产物从 GitHub Release 取。
        if: startsWith(github.event.head_commit.message, 'build:') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mirror_version == '')
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "17"

            # 版本固定（勿改回 channel: stable）：
            # Flutter 3.50.x 的 Windows 引擎在「桌面课表浮窗」这条路径上会
            # 访问冲突闪退（0xC0000005 in flutter_windows.dll，多引擎 +
            # 分层窗口 + 每帧重绘时必现）。3.47.9 实测稳定，.fvmrc 与这里
            # 必须保持一致，否则 local 构建与 Release 又是两个引擎。
            - uses: subosito/flutter-action@v2
              with:
                  flutter-version: "3.47.9"
                  channel: "stable"

            - run: flutter config --enable-windows-desktop

            - run: flutter pub get

            - run: flutter build windows

            # ---------- 提取版本号 ----------
            - name: Extract version from commit message
              id: extract_version
              shell: bash
              run: |
                  VERSION=$(echo "${{ github.event.head_commit.message }}" | sed -n 's/^build:[[:space:]]*//p' | head -n1)
                  echo "VERSION=$VERSION" >> $GITHUB_ENV
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

            # ======== 新增：压缩 Release 文件夹 ========
            - name: Package Release
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              shell: bash
              run: |
                  cd build/windows/x64/runner
                  # 使用 Windows 自带的 7z 压缩（GitHub Actions 环境自带）
                  7z a -tzip release.zip ./Release/*
                  # 完整性校验：客户端下载后先对 sha256，不匹配拒装
                  sha256sum release.zip | awk '{ print $1 }' > release.zip.sha256

            # ---------- 创建 Tag 和 Release ----------
            - name: Create Tag and Release
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  VERSION="${{ steps.extract_version.outputs.version }}"
                  if [ -z "$VERSION" ]; then
                    echo "No version found in commit message"
                    exit 1
                  fi

                  TAG="$VERSION"
                  if git rev-parse "$TAG" >/dev/null 2>&1; then
                    echo "Tag $TAG already exists. Skipping release creation."
                    exit 0
                  fi

                  git tag "$TAG"
                  git push origin "$TAG"

                  # ======== 修改：上传 ZIP 文件，而非文件夹 ========
                  gh release create "$TAG" \
                    --title "Release $VERSION" \
                    --notes "Automated release for version $VERSION" \
                    --target "${{ github.sha }}" \
                    build/windows/x64/runner/release.zip \
                    build/windows/x64/runner/release.zip.sha256

            # ---------- 保留原 artifact 上传（可选） ----------
            - name: Upload artifact (optional)
              uses: actions/upload-artifact@v4
              with:
                  name: windows-release
                  # release.zip 只在 push 到 main 时才生成；PR 构建时该路径缺失只是警告
                  path: |
                      build/windows/x64/runner/Release/
                      build/windows/x64/runner/release.zip
                      build/windows/x64/runner/release.zip.sha256

    # ============================================================
    # Gitee 镜像：把同一份产物发到 Gitee，并在 `update` 分支写 latest.json。
    #
    # 为什么需要：国内一体机 / 校园网里 api.github.com 常被 RST，应用检查更新
    # 会瞬间失败。Gitee 侧只提供「raw 静态清单 + Release 附件」，客户端不调
    # Gitee API（匿名调用会 403 Rate Limit Exceeded）。
    #
    # **不要加 continue-on-error**（1.6.2 踩过）：那会把镜像失败显示成绿色，
    # 让人以为同步成功，实际 Gitee 上没有 Release 也没有 latest.json。
    # GitHub Release 在上一个 job 里已经建好，所以这里失败不会影响发版本身，
    # 只是如实把「镜像没成功」标红。
    #
    # 需要的 secret：GITEE_TOKEN（私人令牌，勾 projects 权限）、
    # GITEE_REPO（如 RuizeSun/class_score，可省略，默认同名）。
    # ============================================================
    mirror-gitee:
        needs: build-windows
        # 两种入口：正常发版（build-windows 成功），或手动补跑指定版本。
        # 必须是单行：YAML 多行块会带真实换行，GitHub 的 if 解析对换行不友好。
        if: "always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-windows.result == 'success') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mirror_version != ''))"
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # 正常发版：用本次构建的产物。
            - uses: actions/download-artifact@v4
              if: github.event_name == 'push'
              with:
                  name: windows-release
                  path: dist

            # 手动补跑：产物从已发布的 GitHub Release 取，不重新构建。
            - name: Fetch artifacts from existing GitHub Release
              if: github.event_name == 'workflow_dispatch'
              shell: pwsh
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ github.event.inputs.mirror_version }}
              run: |
                  New-Item -ItemType Directory -Path dist -Force | Out-Null
                  gh release download $env:VERSION --repo ${{ github.repository }} --pattern 'release.zip*' --dir dist
                  Get-ChildItem dist | Select-Object Name, Length

            - name: Mirror to Gitee
              shell: pwsh
              env:
                  GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
                  GITEE_REPO: ${{ secrets.GITEE_REPO }}
                  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
                  RELEASE_VERSION: ${{ github.event.inputs.mirror_version }}
              run: ./scripts/mirror-to-gitee.ps1
