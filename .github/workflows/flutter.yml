name: Flutter Windows CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build-windows:
        runs-on: windows-latest
        if: startsWith(github.event.head_commit.message, 'build:')
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "17"

            - uses: subosito/flutter-action@v2
              with:
                  channel: "stable"

            - run: flutter config --enable-windows-desktop

            - run: flutter pub get

            - run: flutter build windows

            # ---------- 提取版本号 ----------
            - name: Extract version from commit message
              id: extract_version
              shell: bash
              run: |
                  VERSION=$(echo "${{ github.event.head_commit.message }}" | sed -n 's/^build:[[:space:]]*//p' | head -n1)
                  echo "VERSION=$VERSION" >> $GITHUB_ENV
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

            # ======== 新增：压缩 Release 文件夹 ========
            - name: Package Release
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              shell: bash
              run: |
                  cd build/windows/x64/runner
                  # 使用 Windows 自带的 7z 压缩（GitHub Actions 环境自带）
                  7z a -tzip release.zip ./Release/*

            # ---------- 创建 Tag 和 Release ----------
            - name: Create Tag and Release
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  VERSION="${{ steps.extract_version.outputs.version }}"
                  if [ -z "$VERSION" ]; then
                    echo "No version found in commit message"
                    exit 1
                  fi

                  TAG="$VERSION"
                  if git rev-parse "$TAG" >/dev/null 2>&1; then
                    echo "Tag $TAG already exists. Skipping release creation."
                    exit 0
                  fi

                  git tag "$TAG"
                  git push origin "$TAG"

                  # ======== 修改：上传 ZIP 文件，而非文件夹 ========
                  gh release create "$TAG" \
                    --title "Release $VERSION" \
                    --notes "Automated release for version $VERSION" \
                    --target "${{ github.sha }}" \
                    build/windows/x64/runner/release.zip

            # ---------- 保留原 artifact 上传（可选） ----------
            - name: Upload artifact (optional)
              uses: actions/upload-artifact@v4
              with:
                  name: windows-release
                  path: build\windows\x64\runner\Release\
